name: iOS screenshots + Release IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Enter the release tag (eg, v1.2.7-ios)'
        required: true
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build the Kotlin framework (simulator)
        run: bash gradlew --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          export PRIVACY_POLICY_URL="$(tr -d '[:space:]' < publishing/privacy-policy-url.txt)"
          cd iosApp && xcodegen generate

      - name: Pick and boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          rows=[d for r,v in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in v if d['name'].startswith('iPhone')]
          pick=next((d for d in rows if 'Pro Max' in d['name']), None) or next((d for d in rows if 'Pro' in d['name']), None) or rows[0]
          print(pick['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Capture the five screens (en + ar)
        run: |
          set -o pipefail
          for pair in "en US" "ar SA"; do
            set -- $pair
            export TEST_RUNNER_SCREENSHOT_LANG=$1
            export TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/shots/$1"
            mkdir -p "$TEST_RUNNER_SCREENSHOT_DIR"
            xcodebuild test \
              -project iosApp/iosApp.xcodeproj -scheme iosApp \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -testLanguage "$1" -testRegion "$2" \
              -resultBundlePath "$RUNNER_TEMP/result-$1.xcresult" \
              CODE_SIGNING_ALLOWED=NO
          done
          find "$RUNNER_TEMP/shots" -name '*.png' | sort

      - name: Diagnose launch crash
        if: failure()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/iosApp.app"
          xcrun simctl terminate "$UDID" com.poetscorner.invoiceqr || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --console "$UDID" com.poetscorner.invoiceqr > "$RUNNER_TEMP/launch.log" 2>&1 &
          LPID=$!
          sleep 25
          kill $LPID || true
          echo "===== app console ====="; tail -n 80 "$RUNNER_TEMP/launch.log" || true
          sleep 5
          echo "===== crash reports ====="
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "=== $f"
            python3 - "$f" << 'PY'
          import json, sys
          raw = open(sys.argv[1]).read().split("\n", 1)
          d = json.loads(raw[1])
          print("exception:", d.get("exception"))
          print("termination:", d.get("termination"))
          print("asi:", d.get("asi"))
          imgs = d.get("usedImages", [])
          threads = d.get("threads", [])
          t = threads[d.get("faultingThread", 0)] if threads else {}
          for fr in t.get("frames", [])[:30]:
              print(fr.get("symbol"), "|", imgs[fr["imageIndex"]].get("name") if imgs else "")
          PY
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresults
          path: ${{ runner.temp }}/*.xcresult

  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build the Kotlin framework (device, release)
        run: bash gradlew --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" :shared:linkReleaseFrameworkIosArm64

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          export PRIVACY_POLICY_URL="$(tr -d '[:space:]' < publishing/privacy-policy-url.txt)"
          cd iosApp && xcodegen generate

      # ---- من غير شهادات: IPA غير موقّع (للفحص بس، مش بيتثبّت على جهاز) ----
      - name: Archive (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP=$(ls -d "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app | head -n1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/InvoiceQR-unsigned.ipa" Payload)

      # ---- مع شهادات (Secrets): IPA موقّع ----
      - name: Import signing assets
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k tmp "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive + export (signed)
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD || 'app-store-connect' }}
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution"
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.poetscorner.invoiceqr</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p out && cp "$RUNNER_TEMP"/export/*.ipa out/InvoiceQR.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: out/*.ipa
          if-no-files-found: error

  release:
    needs: [screenshots, ipa]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Zip screenshots
        run: cd dl/screenshots && zip -qr ../../Screenshots.zip .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "${{ inputs.tag }}" \
            --notes "iOS build #${{ github.run_number }} (EN + AR screenshots attached)" \
            dl/ipa/*.ipa Screenshots.zip
