name: KMP verification

on:
  push:
    branches: [new-kmp-invoiceqr]
    paths: [.github/workflows/kmp-verification.yml]

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the simulator toolchain
        run: |
          test "$(uname -m)" = arm64
          git rev-parse HEAD
          xcodebuild -version
          xcrun simctl list devices available
      - name: Compile the iPhone target and run simulator tests
        run: |
          bash gradlew --no-daemon --stacktrace \
            :shared:compileKotlinIosArm64 \
            :shared:iosSimulatorArm64Test
      - name: Verify all 77 tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path("shared/build/test-results/iosSimulatorArm64Test").glob("TEST-*.xml")
          suites = [ET.parse(report).getroot() for report in reports]
          totals = {
              name: sum(int(suite.get(name, 0)) for suite in suites)
              for name in ("tests", "failures", "errors", "skipped")
          }
          print(totals)
          assert totals == {"tests": 77, "failures": 0, "errors": 0, "skipped": 0}
          PY

  android-ui-and-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the pre-UI-port Android baseline
        uses: actions/checkout@v6
        with:
          ref: 269e2f75db19ebf29b248500b8e3cf51c0d5028c
          path: android-stage3-baseline
          persist-credentials: false
      - name: Verify the Android SDK used by the project
        run: |
          if [[ -f "$ANDROID_HOME/platforms/android-37.0/android.jar" &&
                -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            exit 0
          fi
          for sdkmanager in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$sdkmanager" ]]; then
              "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0'
              exit
            fi
          done
          echo "::error::Android command-line tools were not found under $ANDROID_HOME"
          exit 1
      - name: Build Android variants and run host tests
        run: |
          bash gradlew --no-daemon --stacktrace --max-workers=2 \
            -PisolatedValidation=true :shared:testAndroidHostTest :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Build the baseline APKs for language-test comparison
        working-directory: android-stage3-baseline
        run: |
          bash gradlew --no-daemon --stacktrace --max-workers=2 -PisolatedValidation=true \
            :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
      - name: Run Android UI and storage compatibility tests
        id: android-tests
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            bash gradlew --no-daemon --stacktrace --max-workers=2 -PisolatedValidation=true
            :app:assembleDebug :app:assembleDebugAndroidTest &&
            adb install -t -r -g app/build/outputs/apk/debug/app-debug.apk &&
            adb install -t -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb shell am instrument -w -r
            -e class com.poetscorner.invoiceqr.InvoiceAnnotationMigrationTest,com.poetscorner.invoiceqr.DataStoreCompatibilityTest,com.poetscorner.invoiceqr.HistoryOverviewTest,com.poetscorner.invoiceqr.HistoryStorageTest,com.poetscorner.invoiceqr.HistoryBackupTest,com.poetscorner.invoiceqr.HistoryPagerTest,com.poetscorner.invoiceqr.StatisticsStorageTest,com.poetscorner.invoiceqr.LocalizationTest,com.poetscorner.invoiceqr.AppLanguageUiTest,com.poetscorner.invoiceqr.VerificationLevelsUiTest,com.poetscorner.invoiceqr.ZxingQrReaderTest
            "$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/androidTest/debug/output-metadata.json"))["applicationId"])')/androidx.test.runner.AndroidJUnitRunner"
            > "$RUNNER_TEMP/android-tests.txt" &&
            adb shell settings put system font_scale 1.6 &&
            adb shell am instrument -w -r
            -e class com.poetscorner.invoiceqr.NavigationAccessibilityUiTest
            "$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/androidTest/debug/output-metadata.json"))["applicationId"])')/androidx.test.runner.AndroidJUnitRunner"
            >> "$RUNNER_TEMP/android-tests.txt" &&
            adb logcat -d -b crash > "$RUNNER_TEMP/android-crashes.txt" &&
            adb shell settings put system font_scale 1.0 &&
            adb uninstall "$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/androidTest/debug/output-metadata.json"))["applicationId"])')" &&
            adb uninstall "$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["applicationId"])')" &&
            adb install -t -r -g android-stage3-baseline/app/build/outputs/apk/debug/app-debug.apk &&
            adb install -t -r android-stage3-baseline/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb shell am instrument -w -r
            -e class com.poetscorner.invoiceqr.AppLanguageUiTest
            "$(python3 -c 'import json; print(json.load(open("android-stage3-baseline/app/build/outputs/apk/androidTest/debug/output-metadata.json"))["applicationId"])')/androidx.test.runner.AndroidJUnitRunner"
            > "$RUNNER_TEMP/android-language-baseline.txt"
      - name: Verify Android UI and storage test results
        if: always() && steps.android-tests.outcome != 'skipped' && steps.android-tests.outcome != ''
        run: |
          python3 - <<'PY'
          from collections import Counter
          import os
          from pathlib import Path
          import re

          def read_results(filename, expected_invocations):
              log = (output / filename).read_text()
              print(log)
              completed = Counter()
              failed = {}
              fields = {}
              for line in log.splitlines():
                  if line.startswith("INSTRUMENTATION_STATUS: "):
                      key, sep, value = line.removeprefix("INSTRUMENTATION_STATUS: ").partition("=")
                      if sep:
                          fields[key] = value
                  elif line.startswith("INSTRUMENTATION_STATUS_CODE: "):
                      code = int(line.removeprefix("INSTRUMENTATION_STATUS_CODE: "))
                      if code == 0:
                          completed[fields["class"]] += 1
                      elif code == -2:
                          key = (fields["class"], fields["test"])
                          failed[key] = re.sub(r"MainActivity@[0-9a-f]+", "MainActivity",
                                               fields.get("stack", ""))
                      else:
                          assert code == 1, fields
                      fields = {}
              assert log.count("INSTRUMENTATION_CODE: -1") == expected_invocations
              return completed, failed

          output = Path(os.environ["RUNNER_TEMP"])
          crash_log = output / "android-crashes.txt"
          if crash_log.exists():
              print(crash_log.read_text())
          completed, failed = read_results("android-tests.txt", 2)
          baseline_completed, baseline_failed = read_results("android-language-baseline.txt", 1)
          language_class = "com.poetscorner.invoiceqr.AppLanguageUiTest"
          assert baseline_completed[language_class] + len(baseline_failed) == 2
          for key, failure in failed.items():
              assert key[0] == language_class and baseline_failed.get(key) == failure, (key, failure)
          assert completed[language_class] + len(failed) == 3
          assert completed["com.poetscorner.invoiceqr.InvoiceAnnotationMigrationTest"] == 3
          assert completed["com.poetscorner.invoiceqr.DataStoreCompatibilityTest"] == 1
          assert completed["com.poetscorner.invoiceqr.LocalizationTest"] == 3
          assert completed["com.poetscorner.invoiceqr.VerificationLevelsUiTest"] == 2
          assert completed["com.poetscorner.invoiceqr.NavigationAccessibilityUiTest"] == 1
          assert sum(completed.values()) + len(failed) == 34
          print(f"Android: {sum(completed.values())} passed, {len(failed)} reproduced baseline failures.")
          PY
