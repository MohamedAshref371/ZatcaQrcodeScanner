name: KMP verification

on:
  push:
    branches: [new-kmp-invoiceqr]
    paths: [.github/workflows/kmp-verification.yml]

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the simulator toolchain
        run: |
          test "$(uname -m)" = arm64
          git rev-parse HEAD
          xcodebuild -version
          xcrun simctl list devices available
      - name: Compile the iPhone target and run simulator tests
        run: |
          bash gradlew --no-daemon --stacktrace \
            :shared:compileKotlinIosArm64 \
            :shared:iosSimulatorArm64Test
      - name: Verify all 69 tests executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path("shared/build/test-results/iosSimulatorArm64Test").glob("TEST-*.xml")
          suites = [ET.parse(report).getroot() for report in reports]
          totals = {
              name: sum(int(suite.get(name, 0)) for suite in suites)
              for name in ("tests", "failures", "errors", "skipped")
          }
          print(totals)
          assert totals == {"tests": 69, "failures": 0, "errors": 0, "skipped": 0}
          PY

  android-ui-and-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the Android SDK used by the project
        run: |
          if [[ -f "$ANDROID_HOME/platforms/android-37.0/android.jar" &&
                -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            exit 0
          fi
          for sdkmanager in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$sdkmanager" ]]; then
              "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0'
              exit
            fi
          done
          echo "::error::Android command-line tools were not found under $ANDROID_HOME"
          exit 1
      - name: Build Android and run host tests
        run: |
          bash gradlew --no-daemon --stacktrace --max-workers=2 \
            :shared:testAndroidHostTest :app:testDebugUnitTest :app:assembleRelease
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
      - name: Run Android UI and storage compatibility tests
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            bash gradlew --no-daemon --stacktrace --max-workers=2 -PisolatedValidation=true
            :app:assembleDebug :app:assembleDebugAndroidTest &&
            adb install -t -r app/build/outputs/apk/debug/app-debug.apk &&
            adb install -t -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb shell am instrument -w -r
            -e class com.poetscorner.invoiceqr.InvoiceAnnotationMigrationTest,com.poetscorner.invoiceqr.DataStoreCompatibilityTest,com.poetscorner.invoiceqr.HistoryOverviewTest,com.poetscorner.invoiceqr.HistoryStorageTest,com.poetscorner.invoiceqr.HistoryBackupTest,com.poetscorner.invoiceqr.HistoryPagerTest,com.poetscorner.invoiceqr.StatisticsStorageTest,com.poetscorner.invoiceqr.LocalizationTest,com.poetscorner.invoiceqr.AppLanguageUiTest,com.poetscorner.invoiceqr.VerificationLevelsUiTest,com.poetscorner.invoiceqr.NavigationAccessibilityUiTest
            "$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/androidTest/debug/output-metadata.json"))["applicationId"])')/androidx.test.runner.AndroidJUnitRunner"
            > "$RUNNER_TEMP/storage-tests.txt"
      - name: Report Android UI and storage test results
        if: always()
        run: |
          python3 - <<'PY'
          from collections import Counter
          import os
          from pathlib import Path

          log = Path(os.environ["RUNNER_TEMP"], "storage-tests.txt").read_text()
          print(log)
          completed = Counter()
          fields = {}
          for line in log.splitlines():
              if line.startswith("INSTRUMENTATION_STATUS: "):
                  key, sep, value = line.removeprefix("INSTRUMENTATION_STATUS: ").partition("=")
                  if sep:
                      fields[key] = value
              elif line.startswith("INSTRUMENTATION_STATUS_CODE: "):
                  code = int(line.removeprefix("INSTRUMENTATION_STATUS_CODE: "))
                  assert code in (0, 1), fields
                  if code == 0:
                      completed[fields["class"]] += 1
                  fields = {}
          print(dict(completed))
          assert "INSTRUMENTATION_CODE: -1" in log
          assert completed["com.poetscorner.invoiceqr.InvoiceAnnotationMigrationTest"] == 3
          assert completed["com.poetscorner.invoiceqr.DataStoreCompatibilityTest"] == 1
          assert completed["com.poetscorner.invoiceqr.LocalizationTest"] == 3
          assert completed["com.poetscorner.invoiceqr.AppLanguageUiTest"] > 0
          assert completed["com.poetscorner.invoiceqr.VerificationLevelsUiTest"] == 2
          assert completed["com.poetscorner.invoiceqr.NavigationAccessibilityUiTest"] > 0
          PY
