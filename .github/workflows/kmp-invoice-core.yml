name: Kotlin Multiplatform verification

on:
  push:
    branches:
      - kmp-invoice-core
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Select platform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
      revision: ${{ steps.select.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/kmp-invoice-core' && 'kmp-invoice-core' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: select
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          revision="$(git rev-parse HEAD)"
          changed_paths="$RUNNER_TEMP/kmp-changed-paths"
          android=false
          ios=false
          if [[ "$GITHUB_EVENT_NAME" != push ]] ||
             ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null ||
             ! git diff --no-renames --name-only -z "$BEFORE_SHA" "$revision" -- > "$changed_paths"; then
            android=true
            ios=true
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                app/*)
                  android=true
                  ;;
                iosApp/*|.github/workflows/package-iphone-sideload.yml)
                  ios=true
                  ;;
                README.md|README-ar.md|docs/*|publishing/*)
                  ;;
                *)
                  android=true
                  ios=true
                  ;;
              esac
            done < "$changed_paths"
          fi
          printf 'android=%s\nios=%s\nrevision=%s\n' "$android" "$ios" "$revision" >> "$GITHUB_OUTPUT"

  android:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    concurrency:
      group: kmp-android-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.revision }}
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/kmp-invoice-core' }}
      - name: Ensure Android SDK 37 is installed
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [[ -f "$sdk_root/platforms/android-37.0/android.jar" && -x "$sdk_root/build-tools/37.0.0/aapt2" ]]; then
            exit 0
          fi
          for sdkmanager in "$sdk_root"/cmdline-tools/*/bin/sdkmanager; do
            if [[ -x "$sdkmanager" ]]; then
              "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-37.0" "build-tools;37.0.0"
              exit
            fi
          done
          echo "::error::Android command-line tools were not found under $sdk_root"
          exit 1
      - name: Test app integration and shared parser
        run: bash ./gradlew --stacktrace --build-cache :app:testDebugUnitTest :invoiceCore:testAndroidHostTest :invoiceUi:assemble

  ios:
    name: iPhone simulator and shared tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    concurrency:
      group: kmp-ios-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.revision }}
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/kmp-invoice-core' }}
      - name: Verify the iOS simulator toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun simctl list devices available
      - name: Link the iPhone device framework
        if: github.event_name == 'workflow_dispatch'
        run: bash ./gradlew --stacktrace --build-cache :invoiceUi:linkDebugFrameworkIosArm64
      - name: Generate the Xcode project
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec iosApp/project.yml
      - name: Verify the iPhone device build
        if: github.event_name == 'workflow_dispatch'
        run: >
          xcodebuild build
          -project iosApp/InvoicePreview.xcodeproj
          -scheme InvoicePreview
          -destination "generic/platform=iOS"
          -configuration Debug
          -derivedDataPath iosApp/build/iphone-device
          CODE_SIGNING_ALLOWED=NO
      - name: Run the shared Kotlin tests
        run: bash ./gradlew --stacktrace --build-cache :invoiceCore:iosSimulatorArm64Test
      - name: Start the iPhone simulator
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = (key for key in runtimes if ".iOS-" in key)
          for key in sorted(ios, key=lambda key: tuple(map(int, key.split(".iOS-")[-1].split("-"))), reverse=True):
              for device in runtimes[key]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')"
          mkdir -p iosApp/build
          printf '%s\n' "$simulator_id" > iosApp/build/simulator-id
          xcrun simctl boot "$simulator_id"
      - name: Link the simulator framework
        run: bash ./gradlew --stacktrace --build-cache :invoiceUi:linkDebugFrameworkIosSimulatorArm64
      - name: Test the iPhone simulator app
        run: |
          simulator_id="$(cat iosApp/build/simulator-id)"
          xcrun simctl bootstatus "$simulator_id" -b
          test_selection=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            swift iosApp/generate_qr_fixture.swift iosApp/build/invoice-qr.png
            xcrun simctl addmedia "$simulator_id" iosApp/build/invoice-qr.png
          else
            test_selection+=(-only-testing:InvoicePreviewTests)
          fi
          xcodebuild test "${test_selection[@]}" \
            -project iosApp/InvoicePreview.xcodeproj \
            -scheme InvoicePreview \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO \
            -derivedDataPath iosApp/build/derived \
            -resultBundlePath iosApp/build/InvoicePreview.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Export the invoice screenshots
        if: github.event_name == 'workflow_dispatch'
        run: |
          xcrun xcresulttool export attachments \
            --path iosApp/build/InvoicePreview.xcresult \
            --output-path iosApp/build/attachments
          python3 iosApp/export_screenshots.py iosApp/build/attachments iosApp/build/screenshots
      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: iphone-invoice-screenshots
          path: iosApp/build/screenshots/*.png
          if-no-files-found: error
      - name: Report photo-selection diagnostics
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          if [[ -f iosApp/build/simulator-id ]]; then
            xcrun simctl spawn "$(cat iosApp/build/simulator-id)" log show --last 10m --info \
              --predicate 'subsystem == "com.poetscorner.invoiceqr.preview" AND category == "photo-scan"'
          fi
      - name: Report simulator crashes
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          for path in Path.home().joinpath("Library/Logs/DiagnosticReports").glob("InvoicePreview*.ips"):
              _, _, payload = path.read_text(errors="replace").partition("\n")
              try:
                  report = json.loads(payload)
              except json.JSONDecodeError:
                  continue
              print(path.name, report.get("exception"), report.get("termination"))
              threads = report.get("threads", [])
              index = report.get("faultingThread")
              if isinstance(index, int) and index < len(threads):
                  for frame in threads[index].get("frames", [])[:15]:
                      print(frame.get("symbol", frame.get("imageOffset")))
          PY
      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-test-results
          path: iosApp/build/InvoicePreview.xcresult
          if-no-files-found: ignore
