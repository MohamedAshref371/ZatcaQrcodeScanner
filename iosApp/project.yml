name: InvoicePreview
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  InvoicePreview:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poetscorner.invoiceqr.preview
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: قارئ فاتورة
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "InvoiceUI"]
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../invoiceUi/build/bin/iosSimulatorArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/../invoiceUi/build/bin/iosArm64/debugFramework"
    scheme:
      testTargets: [InvoicePreviewUITests]
  InvoicePreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InvoicePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poetscorner.invoiceqr.preview.uitests
