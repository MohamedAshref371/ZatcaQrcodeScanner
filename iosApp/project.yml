name: InvoicePreview
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    INVOICE_APP_GROUP: group.com.poetscorner.invoiceqr.preview
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ZXingCpp:
    url: https://github.com/zxing-cpp/zxing-cpp.git
    exactVersion: 3.1.1
targets:
  InvoicePreview:
    type: application
    platform: iOS
    sources: [Sources, Shared, Resources]
    dependencies:
      - target: InvoiceShare
        embed: true
      - package: ZXingCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poetscorner.invoiceqr.preview
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: SharedInvoices.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/InvoiceZXingDecoder.h
        CLANG_ENABLE_MODULES: YES
        INFOPLIST_KEY_CFBundleDisplayName: Invoice QR Reader
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "InvoiceUI", "-lsqlite3"]
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../invoiceUi/build/bin/iosSimulatorArm64/debugFramework"
        INVOICE_UI_DEVICE_FRAMEWORK_DIR: "$(SRCROOT)/../invoiceUi/build/bin/iosArm64/debugFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(INVOICE_UI_DEVICE_FRAMEWORK_DIR)"
    scheme:
      testTargets: [InvoicePreviewTests, InvoicePreviewUITests]
  InvoiceShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poetscorner.invoiceqr.preview.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Invoice QR Reader
        CODE_SIGN_ENTITLEMENTS: SharedInvoices.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  InvoicePreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: InvoicePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poetscorner.invoiceqr.preview.tests
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../invoiceUi/build/bin/iosSimulatorArm64/debugFramework"
  InvoicePreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InvoicePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poetscorner.invoiceqr.preview.uitests
