# Generated into iosApp.xcodeproj by XcodeGen (`xcodegen generate` inside iosApp/).
name: iosApp
options:
  bundleIdPrefix: com.poetscorner
  deploymentTarget:
    iOS: "15.0"   # ضبطه على نفس deployment target اللي عايزه (zxing بيتبني بـ 13.0)
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.7"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"   # لازم عشان Gradle يشتغل جوه Run Script
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    preBuildScripts:
      - name: Build Kotlin framework + compose resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -z "$JAVA_HOME" ]; then export JAVA_HOME=$(/usr/libexec/java_home 2>/dev/null || true); fi
          cd "$SRCROOT/.."
          bash gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poetscorner.invoiceqr
        GENERATE_INFOPLIST_FILE: "YES"
        # Shared is a static Kotlin framework; zxing's C++ needs libc++ at final link.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared -lc++
        INFOPLIST_KEY_CFBundleDisplayName: Invoice QR Reader
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Camera access is used to scan ZATCA invoice QR codes.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photos are read only when you import invoice images.
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # بيتقرا من publishing/privacy-policy-url.txt في الـ workflow
        PrivacyPolicyURL: ${PRIVACY_POLICY_URL}
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Release
